<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="120" fill="none">
  <defs>
    <!-- Motorsport carbon & dark tungsten slate gradient -->
    <linearGradient id="pitlaneBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="hazardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Pitlane Van & Wrench Icon Badge Container -->
  <g transform="translate(15, 20)" filter="url(#tileShadow)">
    <!-- Rounded Rugged Tech Tile -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#pitlaneBadge)" stroke="#334155" stroke-width="1.5"/>

    <!-- Service Van Body -->
    <g transform="translate(13, 22)">
      <!-- Main Van Chassis -->
      <path d="M 4 28 L 4 12 C 4 9 6 7 9 7 L 34 7 C 36 7 38 9 39 11 L 45 18 C 46 19 47 21 47 23 L 47 28 C 47 29 46 30 45 30 L 4 30 Z" fill="url(#neonCyan)" />
      
      <!-- Windshield / Cab Window -->
      <path d="M 36 10 L 43 18 L 33 18 L 33 10 Z" fill="#e0f2fe" opacity="0.9" />

      <!-- Side Service Window / Panel Stripe -->
      <rect x="10" y="10" width="18" height="7" rx="1.5" fill="#0369a1" />

      <!-- Pitlane High-vis reflective hazard stripe -->
      <rect x="5" y="24" width="41" height="2.5" fill="#facc15" />

      <!-- Front Headlight -->
      <circle cx="46" cy="23" r="1.5" fill="#ffffff" />

      <!-- Wheel Well 1 & Wheel -->
      <circle cx="14" cy="30" r="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <circle cx="14" cy="30" r="2.5" fill="#94a3b8" />

      <!-- Wheel Well 2 & Wheel -->
      <circle cx="38" cy="30" r="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <circle cx="38" cy="30" r="2.5" fill="#94a3b8" />

      <!-- Mechanic Wrench Accent on Top Right -->
      <g transform="translate(38, -6) rotate(42)">
        <path d="M 2 4 C 1 2 2 0 4 0 C 6 0 7 2 6 4 L 8 13 C 8 14 7 15 6 15 C 5 15 4 14 4 13 Z" fill="url(#hazardGold)" />
      </g>
    </g>
  </g>

  <!-- Typography: 'Pitlane' using SF Pro Display style font stack -->
  <g transform="translate(112, 74)">
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" 
          font-weight="700" 
          letter-spacing="-1.2" 
          fill="#0f172a">
      Pit<tspan fill="#0284c7">lane</tspan>
    </text>

    <!-- Cyan telemetry beacon directly above the 'e' -->
    <!-- 'Pit' ~ 60px, 'lane' ~ 90px, center around 145px, top around -35px -->
    <circle cx="144" cy="-35" r="5" fill="#0284c7" filter="url(#glow)"/>
    <circle cx="144" cy="-35" r="4.5" fill="#38bdf8"/>
    <circle cx="142.5" cy="-36.5" r="1.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
